name: Ledger safety checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ledger-safety:
    name: Ledger safety
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run offline Ledger safety tests
        run: python -m unittest discover -s Majestic_Ledger/tests -v
